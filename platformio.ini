; EmoDesk - PlatformIO project
; Uses the pioarduino platform (Arduino-ESP32 core 3.x). The stock "espressif32"
; platform is still on core 2.x, which this firmware does not support.

[platformio]
src_dir = EmoDesk

[env:esp32c3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = EmoDesk/partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  olikraus/U8g2
  bblanchon/ArduinoJson@^7
  knolleary/PubSubClient
  ; Text-to-speech (set ENABLE_TTS 0 in config.h and remove these two lines to drop it)
  earlephilhower/ESP8266Audio
  earlephilhower/ESP8266SAM
